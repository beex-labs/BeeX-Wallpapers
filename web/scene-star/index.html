<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>星空場景</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05070f; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 示例網頁壁紙：自包含星空粒子動畫，無外部依賴。
// 在線直渲時 BeeX 會注入 runtime.js SDK（可選響應音頻/指針），此頁面不依賴任何外部資源。
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, stars = [], shooting = [];

function resize() {
  W = cv.width = innerWidth * devicePixelRatio;
  H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
}
function initStars() {
  stars = [];
  const n = Math.floor(W * H / 9000);
  for (let i = 0; i < n; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .3, tw: Math.random() * Math.PI * 2, sp: .4 + Math.random() * 1.6 });
  }
}
resize(); initStars();
addEventListener('resize', () => { resize(); initStars(); });

// BeeX SDK（存在時）：音頻響應——節奏越強，星星越亮
let sdk = null;
try {
  if (window.BeeX) sdk = window.BeeX;
} catch (e) {}

let t = 0;
function frame() {
  t += .016;
  ctx.clearRect(0, 0, W, H);
  // 星空
  for (const s of stars) {
    const twinkle = .55 + .45 * Math.sin(t * s.sp + s.tw);
    ctx.globalAlpha = twinkle;
    ctx.fillStyle = '#dce6ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 偶發流星
  if (Math.random() < .006 || shooting.length > 0) {
    if (shooting.length < 3) {
      shooting.push({ x: Math.random() * W, y: Math.random() * H * .4, vx: -6 - Math.random() * 5, vy: 3 + Math.random() * 3, life: 1 });
    }
  }
  for (let i = shooting.length - 1; i >= 0; i--) {
    const m = shooting[i];
    m.x += m.vx * 16; m.y += m.vy * 16; m.life -= .018;
    if (m.life <= 0 || m.x < 0 || m.y > H) { shooting.splice(i, 1); continue; }
    const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 10, m.y - m.vy * 10);
    grad.addColorStop(0, `rgba(220,230,255,${.9 * m.life})`);
    grad.addColorStop(1, 'rgba(220,230,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx * 10, m.y - m.vy * 10);
    ctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
